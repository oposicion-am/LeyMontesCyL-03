<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Normativa de Montes CyL</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Normativa de Montes de Castilla y León</h1>
      <p>50 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 50</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Medio", "q": "Una parcela cuyo cultivo agrícola se abandonó hace 22 años y que presenta signos inequívocos de estado forestal se encuentra acogida a un programa público de abandono temporal de la producción agraria. Según la Ley 3/2009:", "o": ["Tiene la condición de monte, porque el abandono supera los veinte años y presenta signos inequívocos de estado forestal.", "No tiene la condición de monte, por hallarse acogida a un programa público de abandono temporal de la producción agraria.", "Solo tendrá la condición de monte cuando el abandono alcance los treinta años.", "Tendrá la condición de monte únicamente si su propietario la adscribe a la finalidad de ser repoblada."], "c": 1, "w": "Art. 2.2.c): son monte los terrenos con cultivo abandonado más de veinte años y signos inequívocos de estado forestal, salvo cuando se hallen acogidos a programas públicos de abandono temporal de la producción agraria."}, {"d": "Medio", "q": "Un bosquete de fresnos de 800 m² situado en el interior de una parcela de cereal, que no forma parte de ningún monte catalogado:", "o": ["Es monte, ya que en él vegetan especies forestales arbóreas.", "Es monte solo si su fracción de cabida cubierta supera el 20 %.", "No es monte, por tratarse de un enclave forestal en terreno agrícola de superficie inferior a una hectárea.", "No es monte, por tratarse de un enclave forestal en terreno agrícola de superficie inferior a diez áreas."], "c": 3, "w": "Art. 2.3.b): no tienen la consideración de monte los enclaves forestales en terrenos agrícolas con una superficie inferior a diez áreas (1.000 m²). 800 m² equivalen a 8 áreas. El límite es de diez áreas, no de una hectárea."}, {"d": "Alto", "q": "Un monte propiedad de un ayuntamiento, no incluido en el Catálogo, cuyo aprovechamiento ha dejado de corresponder al común de los vecinos y que no está afectado a ningún uso o servicio público, tiene la consideración de:", "o": ["Monte demanial comunal.", "Monte patrimonial.", "Monte demanial por razón de servicio público.", "Monte privado de la entidad local."], "c": 1, "w": "Art. 9.1.b) y 9.2: los montes comunales son demaniales «en tanto su aprovechamiento corresponda al común de los vecinos». Los montes de propiedad pública que no sean demaniales son patrimoniales."}, {"d": "Alto", "q": "La desafectación de un monte del dominio público forestal requiere un informe previo de la consejería competente en materia de montes que tiene carácter:", "o": ["Vinculante y favorable, salvo en los procedimientos de prevalencia de utilidad pública, en los que es preceptivo pero no vinculante.", "Preceptivo y vinculante en todos los casos, sin excepción.", "Preceptivo pero no vinculante, salvo en los montes catalogados, en los que es vinculante.", "Facultativo, salvo que la desafectación derive de una permuta."], "c": 0, "w": "Art. 19.3: cualquier desafectación del dominio público requiere informe previo, vinculante y favorable de la consejería, salvo en los procedimientos de prevalencia de utilidad pública, en los que será preceptivo pero no vinculante."}, {"d": "Alto", "q": "La exclusión de un monte del Catálogo se tramita con las mismas exigencias que el procedimiento de inclusión, EXCEPTO cuando la causa es:", "o": ["La desaparición de las causas de utilidad pública o la expropiación por interés social.", "La expropiación, la permuta o la desaparición de las causas de utilidad pública.", "La pérdida de la titularidad pública por sentencia firme, la afección a concentración parcelaria o la permuta.", "Cualquier supuesto de exclusión parcial, sea cual sea su causa."], "c": 2, "w": "Art. 19.2: se exceptúan la pérdida de titularidad por sentencia firme (ejecución de sentencia con participación de la consejería), la concentración parcelaria (art. 33.2) y la permuta (art. 20)."}, {"d": "Alto", "q": "Un monte catalogado se ve afectado por una obra de interés general del Estado de la que puede derivarse otra declaración demanial. Si la Administración General del Estado y la de Castilla y León discrepan sobre cuál debe prevalecer, resolverá:", "o": ["La Junta de Castilla y León.", "El Consejo de Ministros.", "La consejería competente en materia de montes, previo informe de la entidad propietaria.", "El Ministerio competente en materia de montes."], "c": 1, "w": "Art. 21.3: en obras o actuaciones de interés general del Estado, si hay discrepancia entre la AGE y la Administración de Castilla y León, el expediente se eleva al Consejo de Ministros. En caso de acuerdo resuelve la Junta de Castilla y León."}, {"d": "Medio", "q": "En los montes catalogados de utilidad pública, la potestad de desahucio administrativo corresponde:", "o": ["Exclusivamente a la consejería competente en materia de montes.", "A la entidad pública propietaria del monte.", "Conjuntamente a la consejería y a la entidad propietaria, igual que las de investigación, deslinde y recuperación de oficio.", "Al ayuntamiento en cuyo término radique el monte, aunque no sea su propietario."], "c": 0, "w": "Art. 23.1: en los montes catalogados, la consejería y la entidad propietaria son titulares de las potestades de investigación, deslinde y recuperación de oficio, mientras que la de desahucio administrativo corresponde a la consejería."}, {"d": "Alto", "q": "En el acto de apeo del deslinde de un monte patrimonial tienen valor y eficacia:", "o": ["Únicamente los títulos de dominio inscritos en el Registro de la Propiedad.", "Los títulos inscritos y las pruebas de posesión pacífica durante más de veinte años.", "Los títulos de dominio inscritos en el Registro de la Propiedad y las pruebas que acrediten indubitadamente la posesión pública, pacífica, no interrumpida y en concepto de dueño durante más de treinta años.", "Cualquier documento público o privado que acredite la titularidad, aunque no esté inscrito."], "c": 2, "w": "Art. 26.5: en los montes demaniales solo valen los títulos inscritos. En los patrimoniales valen, además, las pruebas de posesión pública, pacífica, no interrumpida y en concepto de dueño durante más de treinta años."}, {"d": "Medio", "q": "El plazo máximo para resolver el procedimiento de deslinde y la consecuencia de superarlo son:", "o": ["Doce meses desde la publicación del anuncio; su transcurso supone la aprobación tácita del deslinde.", "Dieciocho meses desde el acuerdo de iniciación; su transcurso permite entender desestimado el deslinde.", "Veinticuatro meses desde el acuerdo de iniciación; si no se dicta y notifica resolución, el procedimiento caduca y se acuerda el archivo mediante resolución publicada en el BOCyL.", "Veinticuatro meses desde el acto de apeo; su transcurso suspende el procedimiento hasta que se reanude a instancia de los interesados."], "c": 2, "w": "Art. 26.7: el plazo máximo es de veinticuatro meses desde el acuerdo de iniciación. Transcurrido sin resolución, caduca el procedimiento y, previa resolución publicada en el BOCyL, se archivan las actuaciones."}, {"d": "Alto", "q": "Un colindante quiere impugnar la resolución aprobatoria de un deslinde porque considera que una franja incluida en el monte es de su propiedad. Deberá acudir a:", "o": ["La jurisdicción ordinaria, por discutirse el dominio.", "La jurisdicción contencioso-administrativa, una vez agotada la vía administrativa.", "La Junta de Castilla y León, mediante recurso extraordinario de revisión.", "El Registro de la Propiedad, mediante expediente de rectificación de cabida."], "c": 0, "w": "Art. 26.7: la resolución es recurrible ante la jurisdicción contencioso-administrativa por razones de competencia o procedimiento, y ante la jurisdicción ordinaria si se discute el dominio, la posesión o cualquier otro derecho real."}, {"d": "Alto", "q": "Una entidad pública conoce que se ha usurpado una parte de un monte patrimonial de su propiedad. Para recuperar la posesión en vía administrativa:", "o": ["Puede ejercer la potestad en cualquier tiempo, igual que en los montes demaniales.", "Debe iniciar el procedimiento en el plazo de seis meses desde la fecha de la usurpación.", "Debe acudir necesariamente a la jurisdicción ordinaria, porque la recuperación de oficio solo cabe en montes demaniales.", "Debe notificar la iniciación del procedimiento antes de que transcurra un año desde que tuvo conocimiento de la usurpación."], "c": 3, "w": "Art. 27.2: en los montes demaniales la recuperación posesoria puede ejercerse en cualquier tiempo. En los patrimoniales, la iniciación debe notificarse antes de un año desde que la administración tuvo conocimiento de la usurpación."}, {"d": "Medio", "q": "Comprobada la usurpación de un monte público y desatendido el requerimiento de desalojo, la Ley 3/2009 permite:", "o": ["Imponer multas coercitivas de hasta 6.000 €, reiteradas cada mes hasta el desalojo.", "Imponer multas coercitivas de hasta el 20 % de la sanción, reiteradas cada diez días.", "Únicamente la ejecución subsidiaria, sin posibilidad de multas coercitivas.", "Imponer multas coercitivas de hasta 3.000 €, reiteradas por periodos de quince días hasta que se produzca el desalojo, siendo de cuenta del usurpador los gastos del desalojo."], "c": 3, "w": "Art. 27.3 y 4: el plazo de desalojo voluntario no será superior a quince días. Pueden imponerse multas coercitivas de hasta 3.000 € reiteradas por periodos de quince días, y los gastos del desalojo corren a cargo del usurpador."}, {"d": "Alto", "q": "Un mismo propietario vende a título oneroso dos fincas forestales de 90 y 70 hectáreas separadas por 400 metros. Respecto a los derechos públicos de adquisición preferente:", "o": ["No existen, porque ninguna de las fincas supera individualmente las 150 hectáreas.", "Existen, porque son fincas del mismo dueño separadas menos de 500 metros que en conjunto superan 150 hectáreas, con preferencia de la Comunidad de Castilla y León sobre la entidad local.", "Existen, con preferencia de la entidad local en cuyo término radique la mayor superficie sobre la Comunidad.", "Solo existen si alguna de las fincas está declarada monte protector."], "c": 1, "w": "Art. 30.1.b) y 30.2: hay derecho de adquisición preferente en fincas colindantes o separadas menos de 500 m, del mismo dueño, que en conjunto superen 150 ha (90 + 70 = 160 ha). Tiene preferencia la Comunidad de Castilla y León."}, {"d": "Alto", "q": "Se vende a título oneroso un terreno que linda a la vez con tres montes públicos de distintas entidades. Tendrá preferencia para ejercer los derechos de tanteo y retracto:", "o": ["La Comunidad de Castilla y León en todo caso.", "La entidad local en cuyo término radique la mayor superficie del terreno vendido.", "La entidad pública que tenga la linde común más extensa con el terreno.", "La entidad cuyo monte tenga mayor superficie total."], "c": 2, "w": "Art. 30.3: en la adquisición de enclavados y terrenos colindantes con montes públicos, en caso de colindancia múltiple tiene preferencia la entidad pública con la linde común más extensa."}, {"d": "Medio", "q": "Los referentes selvícolas que puede aprobar la consejería competente en materia de montes:", "o": ["Se aplican a montes de más de 100 hectáreas sin proyecto de ordenación y tienen carácter de normas forestales.", "Se dirigen a montes de superficie inferior a 100 hectáreas y tienen la consideración de instrumentos de ordenación forestal.", "Son directrices meramente orientativas, sin consideración de instrumento de ordenación.", "Se aprueban por decreto de la Junta como Instrucciones Generales para la Ordenación de Montes."], "c": 1, "w": "Art. 41 bis: los referentes selvícolas recogen las actuaciones para la gestión sostenible de montes de superficie inferior a 100 ha y tienen la consideración de instrumentos de ordenación forestal (art. 38)."}, {"d": "Alto", "q": "Una entidad local titular de un monte catalogado incluye en su pliego económico-administrativo un precio de enajenación de la madera inferior al precio mínimo fijado por la consejería. Esa estipulación es:", "o": ["Anulable a instancia de la consejería en el plazo de cuatro años.", "Válida si la aprueba el pleno, porque las condiciones económicas corresponden a la entidad titular.", "Nula de pleno derecho.", "Válida, pero la diferencia de precio debe ingresarse en el Fondo de Mejoras."], "c": 2, "w": "Art. 46.5 y 46.6: el precio mínimo lo determina la consejería y la entidad titular no puede enajenar por debajo de él. Esas estipulaciones son nulas de pleno derecho."}, {"d": "Alto", "q": "Un aprovechamiento de un monte catalogado se adjudica mediante un procedimiento de enajenación tramitado por la propia entidad local. Respecto a la licencia de aprovechamiento:", "o": ["El adjudicatario debe acreditar el ingreso al Fondo de Mejoras y las demás obligaciones en un mes desde la adjudicación definitiva; la licencia se expide en quince días desde su solicitud y, si no se notifica, puede entenderla concedida.", "La licencia se expide de oficio en el momento de formalizarse el contrato, sin necesidad de solicitud.", "El adjudicatario dispone de tres meses para acreditar las obligaciones y el silencio sobre la licencia es desestimatorio.", "Las obligaciones deben acreditarse en quince días y la licencia se expide en el plazo de un mes."], "c": 0, "w": "Art. 51.2 y 51.3: las obligaciones se cumplen en un mes desde la adjudicación. La licencia se expide en quince días desde la solicitud, con silencio positivo. Solo se expide de oficio cuando la enajenación la tramita la consejería."}, {"d": "Medio", "q": "Respecto a los pastos sobrantes de los montes catalogados de utilidad pública:", "o": ["Se adjudican siempre al precio mínimo de tasación, igual que los aprovechamientos vecinales.", "Se adjudican con preferencia a ganaderos de municipios colindantes, y se permite el subarriendo con autorización de la consejería.", "Son la parte no destinada al uso propio de los vecinos; en su adjudicación tienen preferencia los titulares de explotaciones ganaderas vecinos de la entidad propietaria y está prohibida su cesión o subarriendo a terceros.", "Son los que exceden la carga ganadera del instrumento de ordenación y deben subastarse sin ninguna preferencia."], "c": 2, "w": "Art. 53.2: la parte no destinada a uso propio de los vecinos se considera pastos sobrantes. Tienen preferencia los ganaderos vecinos de la entidad propietaria y queda prohibida la cesión o subarriendo a terceros."}, {"d": "Alto", "q": "Un propietario de un monte privado sin instrumento de ordenación solicita autorización para una corta que no es de turno corto ni de menor cuantía. Si en un mes la consejería no ha resuelto ni notificado:", "o": ["Puede entender concedida la autorización por silencio positivo.", "Puede iniciar la corta presentando una declaración responsable.", "El plazo se amplía automáticamente un mes más.", "Debe entender denegada la autorización por silencio administrativo."], "c": 3, "w": "Art. 57.1 y 57.4: sin instrumento de ordenación se necesita autorización previa. La consejería debe resolver y notificar en un mes, y el transcurso del plazo habilita a entender denegada la autorización."}, {"d": "Alto", "q": "Una empresa pretende instalar en un monte catalogado una caseta de comunicaciones que ocupará en exclusiva una porción del monte durante seis años. El título habilitante necesario y su duración máxima son:", "o": ["Una concesión demanial, por tratarse de un uso privativo, con un plazo máximo de 25 años.", "Una autorización demanial por uso especial, con un plazo máximo de cuatro años.", "Una concesión demanial con un plazo máximo de 75 años.", "Una licencia de aprovechamiento, con una duración igual a la vida útil de la instalación."], "c": 0, "w": "Art. 61.4, 62.3 y 65.4: el uso es privativo cuando la ocupación es excluyente y perdurable (más de cuatro años). Requiere concesión, cuyo plazo máximo no puede exceder de 25 años. Las autorizaciones tienen un máximo de cuatro años (art. 66.1)."}, {"d": "Alto", "q": "En el procedimiento para otorgar una autorización de uso especial en un monte catalogado por razones de interés privado, el informe desfavorable de la entidad propietaria:", "o": ["Impide la continuación del procedimiento (carácter obstativo).", "Obliga a elevar el expediente a la Junta de Castilla y León para que resuelva.", "Es preceptivo pero no vinculante para la consejería.", "Solo impide continuar el procedimiento cuando se trata de concesiones."], "c": 0, "w": "Art. 63.2 y 63.3: el informe de la entidad propietaria es obstativo cuando la autorización o concesión es por interés privado. Si es por interés público y la entidad está disconforme, resuelve la Junta de Castilla y León."}, {"d": "Alto", "q": "Para una concesión en un monte catalogado destinada al uso público gratuito, la contraprestación económica mínima:", "o": ["Se calcula aplicando un 6 % anual sobre el valor del suelo y el beneficio esperado, más los daños y perjuicios, y la consejería puede reducirla de forma razonada hasta un 85 %.", "Se calcula aplicando un 4 % anual sobre el valor del suelo, con reducciones de hasta el 50 %.", "Se calcula aplicando un 6 % anual, pero el uso público gratuito queda exento de toda contraprestación.", "Se calcula aplicando un 5 % anual sobre el valor catastral, con reducciones de hasta el 85 %."], "c": 0, "w": "Art. 69.2 y 69.3: el criterio básico es un tipo del 6 % anual sobre el valor del suelo y el beneficio esperado, incrementado con los daños y perjuicios. Caben reducciones razonadas de hasta el 85 % para uso público gratuito, fines sociales o iniciativas públicas no lucrativas."}, {"d": "Alto", "q": "Para acogerse al procedimiento simplificado de reversión al uso agrícola de una parcela de monte privado, la parcela debe cumplir:", "o": ["Pendiente no superior al 20 %, cultivo agrícola en los veinte años anteriores y silencio estimatorio a los dos meses.", "Pendiente no superior al 15 %, cultivo agrícola en los treinta años anteriores y silencio estimatorio a un mes.", "Pendiente no superior al 15 %, cultivo agrícola dentro de los treinta años anteriores a la solicitud y aptitud técnica y económica para el cultivo; la consejería resuelve en dos meses con silencio desestimatorio.", "Pendiente no superior al 10 %, cultivo agrícola en los veinte años anteriores y resolución en tres meses."], "c": 2, "w": "Art. 71.3 y 71.4: pendiente máxima del 15 %, cultivo agrícola en los treinta años anteriores y aptitud técnica y económica informada por la consejería de agricultura. Plazo de dos meses; su vencimiento permite entender desestimada la petición."}, {"d": "Medio", "q": "En un monte catalogado de utilidad pública, la consejería puede autorizar una roturación para fomentar la fauna silvestre siempre que:", "o": ["Sean superficies menores de 10 hectáreas por monte, arboladas o no.", "Sean superficies de escasa extensión, en todo caso menores de 5 hectáreas por monte, en terrenos desarbolados.", "Sean superficies menores de 5 hectáreas por cada cuartel de ordenación.", "No es posible: la prohibición de roturar en montes catalogados no admite excepciones."], "c": 1, "w": "Art. 75.2.a): se pueden autorizar roturaciones en superficies menores de 5 ha por monte, con la finalidad de fomentar la fauna silvestre o producir productos alimentarios forestales, en terrenos desarbolados."}, {"d": "Medio", "q": "En la aprobación de un instrumento de planeamiento urbanístico que afecta a la clasificación de terrenos forestales, el informe de la consejería competente en materia de montes es:", "o": ["Facultativo, salvo en montes catalogados, en los que es preceptivo.", "Preceptivo y vinculante para cualquier terreno forestal.", "Preceptivo, y vinculante cuando se trate de montes catalogados, protectores o con régimen de protección especial.", "Preceptivo pero nunca vinculante, porque la competencia urbanística es municipal."], "c": 2, "w": "Art. 80.2: el informe previo es preceptivo cuando el instrumento afecte a la clasificación de terrenos forestales, y vinculante en montes catalogados, protectores y con régimen de protección especial."}, {"d": "Alto", "q": "Unas medidas de reducción del riesgo de incendios en una zona de interfaz urbano-forestal identificada en el plan anual se ejecutan a 80 m del casco urbano, en suelo rústico común. Estas medidas:", "o": ["Requieren declaración responsable al tratarse de aprovechamientos maderables en monte sin instrumento de ordenación.", "Tienen la consideración de interés general y quedan exentas de los procedimientos sobre aprovechamientos maderables o leñosos, cambio de uso forestal y modificación del suelo y de la cubierta vegetal.", "Solo quedarían exentas si se ejecutaran en suelo rústico con protección natural.", "Solo quedarían exentas si se ejecutaran a menos de 50 m del casco urbano."], "c": 1, "w": "Art. 88.3: las medidas en interfaz urbano-forestal identificada en los planes anuales, a menos de 100 m del casco urbano y en terreno rústico no clasificado con protección natural, son de interés general y quedan exentas de los procedimientos de los arts. 56, 57, 71 y 73."}, {"d": "Alto", "q": "Tras un incendio que ha afectado a 650 hectáreas de superficie forestal, en los pastizales herbáceos que se venían pastoreando habitualmente:", "o": ["La suspensión de cinco años no puede levantarse en ningún caso.", "La consejería puede autorizar de oficio el levantamiento de la suspensión del aprovechamiento ganadero.", "La suspensión es de tres años y se levanta automáticamente al finalizar.", "El levantamiento solo cabe a instancia del ganadero, si acredita que el fuego afectó a más de la mitad de su superficie pastable."], "c": 1, "w": "Art. 92.1: los aprovechamientos ganaderos y cinegéticos quedan suspendidos cinco años. En grandes incendios (más de 500 ha forestales) o cuando se afecte a más de una cuarta parte de la superficie pastable de la explotación, la consejería puede autorizar de oficio el levantamiento en pastizales herbáceos habitualmente pastoreados."}, {"d": "Medio", "q": "En los montes afectados por incendios forestales, la Ley 3/2009 establece que:", "o": ["Se prohíbe el cambio de uso forestal durante veinte años y la modificación de la clasificación urbanística durante treinta.", "Se prohíben el cambio de uso forestal y la modificación de la clasificación urbanística durante cinco años, igual que el pastoreo.", "Se prohíbe el cambio de uso forestal durante treinta años, pero la clasificación urbanística no tiene limitación.", "Se prohíben el cambio de uso forestal y la modificación de la clasificación urbanística durante treinta años, salvo los supuestos de excepcionalidad del artículo 50 de la Ley 43/2003."], "c": 3, "w": "Art. 92.2, 92.3 y 92.4: ambas prohibiciones duran treinta años y no se aplican cuando la consejería aprecie los supuestos de excepcionalidad del artículo 50 de la Ley 43/2003."}, {"d": "Alto", "q": "Los beneficios de servicios ecosistémicos con valor de mercado generados por inversiones de la Comunidad (art. 99) en un monte catalogado:", "o": ["Se ingresan en un 15 % en el Fondo de Mejoras y el resto corresponde a la entidad propietaria.", "Se ingresan en un 30 % en el Fondo de Mejoras para la restauración del monte.", "Se ingresan íntegramente en la Tesorería de la Comunidad de Castilla y León.", "Se ingresan íntegramente en el Fondo de Mejoras y al menos el 50 % se destina a mejoras de interés forestal general."], "c": 3, "w": "Art. 104 bis.7: los beneficios de servicios ecosistémicos generados por las inversiones del artículo 99 en montes catalogados se ingresan íntegramente en el Fondo de Mejoras, y al menos el 50 % se destina a mejoras de interés forestal general."}, {"d": "Medio", "q": "Un monte catalogado afectado por un vendaval genera ingresos por aprovechamientos extraordinarios de la madera derribada. El porcentaje que debe destinarse al Fondo de Mejoras es:", "o": ["El 15 % mínimo general, porque el vendaval no tiene la consideración de evento catastrófico.", "Hasta el 30 % de los ingresos derivados de los aprovechamientos extraordinarios consecuencia del siniestro.", "El 25 % de los ingresos del monte durante los cinco años siguientes.", "El 50 % de los ingresos, como en los montes propiedad de la Comunidad."], "c": 1, "w": "Art. 108.1: en montes afectados por eventos catastróficos (incendios, plagas o vendavales), el porcentaje se eleva hasta el 30 % de los ingresos de los aprovechamientos extraordinarios consecuencia del siniestro."}, {"d": "Alto", "q": "Una corta sin autorización de ejemplares arbóreos causa al monte daños cuyo plazo de reparación o restauración se estima en ocho años. La infracción se califica como:", "o": ["Muy grave.", "Grave.", "Leve.", "Grave solo si la superficie afectada supera 5 hectáreas; en otro caso, leve."], "c": 1, "w": "Art. 114.2.c): las infracciones de los párrafos b), c), d), e) y h) del art. 113 son graves si el plazo de reparación es inferior a 10 años y superior a 6 meses. Para calificarla se requiere informe técnico del servicio territorial (art. 114.4)."}, {"d": "Medio", "q": "Una persona sancionada por resolución firme por una infracción grave a la Ley 3/2009 queda inscrita en el Registro Regional de Infractores. La anotación se cancela:", "o": ["A los tres años; hasta entonces no puede obtener licencias de aprovechamiento.", "A los dos años; hasta entonces tiene la condición de reincidente a efectos de graduar sanciones.", "Al año; la reincidencia solo se aprecia dentro de ese plazo.", "A los cinco años, sea cual sea la gravedad de la infracción."], "c": 1, "w": "Art. 123.3: la cancelación se produce a los tres años para las muy graves, dos para las graves y uno para las leves. Según el art. 118.3, el infractor es reincidente mientras no tenga cancelados sus antecedentes."}, {"d": "Alto", "q": "En un monte catalogado, la indemnización por los daños y perjuicios a funciones distintas de la productora (paisaje, biodiversidad, protección del suelo):", "o": ["Se abona a la Comunidad de Castilla y León por las funciones del monte afectadas.", "Se ingresa en el Fondo de Mejoras y debe aplicarse a actuaciones de interés forestal general.", "Se liquida a favor de la entidad propietaria del monte.", "Se ingresa en un 15 % en el Fondo de Mejoras y el resto corresponde a la entidad propietaria."], "c": 1, "w": "Art. 125.2: la parte no productora se abona a la Comunidad, salvo en montes catalogados, donde se ingresa en el Fondo de Mejoras para actuaciones de interés forestal general (también art. 5.5 del Decreto 23/2018)."}, {"d": "Alto", "q": "Cuando el responsable de un daño a un monte no cumple la obligación de repararlo, las multas coercitivas que puede imponer el órgano sancionador:", "o": ["Se reiteran por lapsos no inferiores a quince días, y cada una no puede exceder del 20 % de la multa fijada por la infracción ni, en ningún caso, de 3.000 €.", "Se reiteran cada mes, y cada una puede alcanzar el 50 % de la multa, con un máximo de 6.000 €.", "Se reiteran cada diez días, y cada una no puede exceder del 10 % de la multa, sin límite absoluto.", "Se imponen una sola vez, por el mismo importe que la sanción principal."], "c": 0, "w": "Art. 126.5: lapsos no inferiores a quince días; cada multa no puede exceder del 20 % de la multa fijada y nunca supera 3.000 €. En montes demaniales, la obligación de restauración es imprescriptible (art. 126.2)."}, {"d": "Alto", "q": "Un ganadero introduce en un monte 20 vacas mayores de 24 meses, 10 terneros de 6 a 24 meses y 100 ovejas. Según las equivalencias de la Ley 3/2009, la carga ganadera es:", "o": ["45 U.G.M.", "36 U.G.M.", "50 U.G.M.", "41 U.G.M."], "c": 3, "w": "Disposición final segunda: vacuno mayor de 24 meses = 1 U.G.M. (20); terneros de 6 a 24 meses = 0,6 (6); ovino = 0,15 (15). Total: 20 + 6 + 15 = 41 U.G.M."}, {"d": "Alto", "q": "Respecto al porcentaje común que cada Comisión Territorial de Mejoras acuerda anualmente para mejoras de interés forestal general (Decreto 23/2018):", "o": ["Solo puede superar el 25 % de los ingresos de cada monte si lo autoriza la dirección general mediante resolución, a propuesta de la Comisión, y no afecta a las aportaciones suplementarias voluntarias salvo acuerdo de la entidad titular.", "No puede superar en ningún caso el 5 % de los ingresos, igual que los gastos de funcionamiento.", "Lo fija directamente el artículo 108 de la Ley 3/2009 en el 15 % de los ingresos de cada monte.", "Puede superar el 25 % por acuerdo de la mayoría de la Comisión, y se aplica también a las aportaciones suplementarias voluntarias."], "c": 0, "w": "Art. 6.2 y 6.3 del Decreto 23/2018: el porcentaje solo puede superar el 25 % con resolución de la dirección general, a propuesta de la Comisión. Las aportaciones suplementarias voluntarias no quedan afectadas salvo que la entidad titular lo acuerde."}, {"d": "Alto", "q": "Para que la Comisión Territorial de Mejoras quede válidamente constituida en segunda convocatoria se requiere la asistencia, presencial o a distancia, de:", "o": ["Quienes ostenten la presidencia y la secretaría y de la mitad, al menos, del resto de sus miembros.", "Quien ostente la presidencia y de un tercio del resto de miembros, sin que sea necesaria la secretaría.", "Cualquier número de miembros, siempre que asista quien ostente la presidencia.", "Quienes ostenten la presidencia y la secretaría y de al menos un tercio del resto de sus miembros, en número no inferior a tres."], "c": 3, "w": "Art. 13.2 y 13.3 del Decreto 23/2018: en primera convocatoria se requiere presidencia, secretaría y la mitad del resto. En segunda, presidencia, secretaría y al menos un tercio del resto, nunca menos de tres."}, {"d": "Alto", "q": "Según el Decreto 23/2018, el calendario de tramitación del Plan Anual de Mejoras es:", "o": ["Antes del 20 de febrero, comunicación a las entidades titulares con un plazo de 10 días para alegaciones; antes del 15 de marzo, presentación a la Comisión; antes del 31 de marzo, aprobación por la dirección general.", "Antes del 31 de enero, comunicación con 15 días para alegaciones; antes del 28 de febrero, Comisión; antes del 31 de marzo, aprobación por la consejería.", "Antes del 20 de febrero, comunicación con 10 días para alegaciones; antes del 15 de marzo, aprobación por la Comisión; antes del 31 de marzo, publicación en el BOCyL.", "Antes del 15 de marzo, comunicación con 20 días para alegaciones; antes del 30 de abril, aprobación por la delegación territorial."], "c": 0, "w": "Art. 16.3, 16.5 y 16.6 del Decreto 23/2018: comunicación antes del 20 de febrero (10 días de alegaciones; sin alegaciones se entiende la conformidad); presentación a la Comisión antes del 15 de marzo, que informa el Plan y aprueba las cuentas; aprobación por la dirección general antes del 31 de marzo."}, {"d": "Medio", "q": "En un aprovechamiento forestal para uso propio de los vecinos en un monte catalogado, el porcentaje destinado al Fondo de Mejoras se aplica sobre:", "o": ["El precio mínimo de tasación que determine la consejería, salvo que la entidad titular considere una tasación mayor.", "El precio de adjudicación del aprovechamiento.", "El ingreso neto obtenido por la entidad titular.", "El valor de mercado de los productos en el momento de su extracción."], "c": 0, "w": "Art. 4.a).2.º del Decreto 23/2018: en los aprovechamientos para uso propio de los vecinos se aplica sobre el precio mínimo de tasación de la consejería, o sobre una tasación mayor si así lo considera la entidad. El precio de adjudicación se usa en los demás aprovechamientos."}, {"d": "Alto", "q": "Una delegación territorial puede pedir la contratación centralizada de mejoras por su especial envergadura cuando el presupuesto de ejecución material no sea inferior a:", "o": ["50.000 € en los contratos de obras y 200.000 € en los restantes.", "100.000 € en los contratos de obras y 30.000 € en los restantes.", "200.000 € en los contratos de obras y 50.000 € en los restantes.", "300.000 € en cualquier tipo de contrato."], "c": 2, "w": "Art. 18.1.d) del Decreto 23/2018: en casos excepcionales por envergadura, los expedientes deben tener un presupuesto de ejecución material no inferior a 200.000 € en obras y 50.000 € en los restantes. Actúa como órgano de contratación el titular de la consejería (art. 18.2)."}, {"d": "Medio", "q": "En un monte privado, un aprovechamiento de carácter experimental con técnicas novedosas, en condiciones distintas de las del Decreto 5/2025, requiere:", "o": ["Autorización de la persona titular del servicio territorial, acompañada del documento de determinación del aprovechamiento.", "Declaración responsable ante el servicio territorial, con memoria suscrita por técnico forestal competente.", "Nada, porque los aprovechamientos con fines científicos no están sujetos a regulación.", "Autorización de la persona titular de la dirección general competente en montes, con una memoria justificativa suscrita por técnico forestal competente y un informe que avale su interés y viabilidad."], "c": 3, "w": "Arts. 4.2, 8.3 y 9.2.b) del Decreto 5/2025: los aprovechamientos experimentales los autoriza la dirección general. Se acompañan de memoria de técnico forestal competente con informe de una institución científica, asociación sectorial o entidad innovadora. El art. 6.6 solo excluye las autorizaciones científicas distintas de las del art. 4.2."}, {"d": "Medio", "q": "Un titular quiere realizar aprovechamientos maderables en tres fincas de la provincia de Salamanca y en una de Ávila. Según el Decreto 5/2025 deberá presentar:", "o": ["Una única solicitud o declaración que incluya las cuatro fincas, dirigida al servicio territorial de la provincia con más superficie.", "Cuatro solicitudes o declaraciones, una por cada finca.", "Una única solicitud dirigida a la dirección general, por afectar a dos provincias.", "Dos solicitudes o declaraciones responsables, una por provincia, agrupando en una sola las tres fincas de Salamanca."], "c": 3, "w": "Art. 7.4 del Decreto 5/2025: se puede presentar una única solicitud o declaración para varios terrenos del mismo titular, salvo que estén en dos o más provincias. En ese caso se presenta una independiente por provincia."}, {"d": "Medio", "q": "En un aprovechamiento maderable o leñoso, el documento de determinación del aprovechamiento debe ir suscrito por técnico forestal competente cuando:", "o": ["El aprovechamiento supere los 200 metros cúbicos.", "El aprovechamiento supere los 1.000 metros cúbicos o se realice en monte sin instrumento de ordenación.", "El aprovechamiento supere los 500 metros cúbicos o su equivalente en toneladas o estéreos.", "Siempre, sea cual sea la cuantía del aprovechamiento."], "c": 2, "w": "Art. 8.2 del Decreto 5/2025: el documento de determinación indica los pies objeto del aprovechamiento y el procedimiento seguido. Debe firmarlo un técnico forestal competente cuando supere 500 m³ o su equivalente en toneladas o estéreos."}, {"d": "Alto", "q": "Según el Decreto 5/2025, ¿cuál de los siguientes aprovechamientos NO requiere ni autorización ni declaración responsable?", "o": ["El aprovechamiento de matorral de 1,8 metros de altura.", "La poda de ramas de chopos que no sea de menor cuantía.", "La recolección de 4 kg de piña cerrada de pino piñonero.", "La recolección de 6 kg de piña cerrada en un monte."], "c": 2, "w": "Art. 6.2 del Decreto 5/2025: no está regulada la piña cerrada en cuantía igual o inferior a 5 kg. En cambio, requieren declaración responsable la piña cerrada de más de 5 kg (art. 5.7), el matorral de más de 1,5 m (art. 5.10) y la poda de géneros distintos de Quercus y Fraxinus que no sea de menor cuantía (art. 5.5)."}, {"d": "Alto", "q": "Tras una corta a hecho en un pinar de Pinus pinaster sin instrumento de ordenación ni referente selvícola aplicable, se entenderá regenerado satisfactoriamente cuando existan:", "o": ["400 pies viables por hectárea, en un plazo máximo de cinco años desde la corta final.", "600 pies viables por hectárea o una fracción de cabida cubierta superior al 40 %, en un plazo de tres años.", "800 pies viables por hectárea distribuidos uniformemente, en un plazo máximo de cinco años desde la corta final.", "200 pies viables por hectárea, en un plazo máximo de diez años."], "c": 2, "w": "Disposición transitoria primera, 1.c) del Decreto 5/2025: la regeneración debe hacerse en cinco años. A falta de referente selvícola, el mínimo es de 400 pies/ha en Pinus pinea y 800 en el resto de Pinus; 600 pies o FCC superior al 40 % en frondosas autóctonas; y 200 en el resto de especies."}, {"d": "Alto", "q": "En el mes de junio queda apeada madera de pino a 60 metros de una masa arbolada de Pinus. Si el servicio territorial no autoriza otro periodo, el plazo máximo de permanencia en el monte es:", "o": ["Cuatro semanas.", "Dos semanas.", "Quince días hábiles.", "Un mes."], "c": 1, "w": "Disposición transitoria primera, 1.d) del Decreto 5/2025: a menos de 100 m de masas de Pinus, la madera apeada puede permanecer cuatro semanas, que se reducen a dos entre el 1 de abril y el 31 de octubre. Los montones de astillas se situarán a más de 100 m, con una banda sin vegetación de 9 m."}, {"d": "Alto", "q": "Un alcornoque con un perímetro normal de 80 cm sobre corteza va a ser desbornizado. Según el Decreto 5/2025:", "o": ["Puede desbornizarse durante la campaña del 15 de junio al 30 de septiembre, con una altura máxima de 2,00 m.", "No puede desbornizarse, porque el perímetro mínimo exigido es de 90 cm.", "Puede desbornizarse entre el 1 de mayo y el 31 de agosto, con una altura máxima de 2,40 m.", "Puede desbornizarse durante la campaña del 15 de junio al 30 de septiembre, con una altura máxima de desbornizamiento de 1,60 m."], "c": 3, "w": "Disposición transitoria primera, 4 del Decreto 5/2025: el perímetro mínimo es de 65 cm, la campaña va del 15 de junio al 30 de septiembre y la altura máxima de desbornizamiento es dos veces el perímetro normal (2 × 0,80 = 1,60 m). El corcho segundero admite 2,5 veces y el siguiente, 3. El turno es de al menos diez años."}, {"d": "Alto", "q": "En el aprovechamiento de piña cerrada, el vibrado de los pinos solo se permite:", "o": ["En parada vegetativa y nunca a partir del 15 de marzo, en árboles de al menos 20 cm de diámetro normal, sin superar 3 segundos y una única vez por árbol.", "Durante toda la campaña hasta el 10 de abril, en árboles de al menos 15 cm de diámetro y sin superar 5 segundos.", "En parada vegetativa y nunca a partir del 1 de marzo, en árboles de al menos 25 cm de diámetro, con un máximo de dos vibraciones por árbol.", "Cuando los brotes terminales estén helados, para facilitar el desprendimiento de la piña."], "c": 0, "w": "Disposición transitoria primera, 2.c) del Decreto 5/2025: prohibido el vareo. El vibrado solo en parada vegetativa y nunca desde el 15 de marzo, nunca con brotes helados, en árboles de al menos 20 cm de diámetro normal, no más de 3 segundos, una vez por árbol y con pinza con protectores."}, {"d": "Alto", "q": "Un agente medioambiental suspende provisionalmente un aprovechamiento que incumple sus condiciones y ordena retirar al personal y los equipos. Según el Decreto 5/2025:", "o": ["El acta o denuncia se remite en los dos días siguientes al órgano competente para iniciar el procedimiento, que debe confirmar, modificar o levantar la medida en el acuerdo de iniciación, dentro de los quince días siguientes a su adopción.", "El acta se remite en diez días y la medida debe ratificarse en el plazo de un mes.", "El acta se remite en las 48 horas siguientes y la medida debe ratificarse en el plazo de diez días.", "El acta se remite en cinco días y la medida la ratifica la dirección general en quince días."], "c": 0, "w": "Art. 19.2 del Decreto 5/2025: el acta o denuncia se remite en los dos días siguientes. Las medidas deben confirmarse, modificarse o levantarse en el acuerdo de iniciación dentro de los quince días siguientes, y quedan sin efecto si no se inicia el procedimiento en ese plazo o si el acuerdo no se pronuncia sobre ellas."}, {"d": "Alto", "q": "En un aprovechamiento mediante poda de encinas (género Quercus), salvo previsión distinta de un instrumento de ordenación:", "o": ["No puede podarse entre el 1 de abril y el 31 de octubre; los cortes no superarán 15 cm y las heridas de más de 10 cm se sellarán.", "No puede podarse entre el 1 de mayo y el 31 de agosto; los cortes no superarán 25 cm y todas las heridas se sellarán.", "Puede podarse todo el año; los cortes no superarán 20 cm y se sellarán las heridas de más de 20 cm.", "No puede podarse entre el 1 de mayo y el 31 de agosto; los cortes no superarán con carácter general 20 cm de diámetro y las heridas de más de 15 cm se sellarán con pasta cicatrizante."], "c": 3, "w": "Disposición transitoria primera, 1.b) y 1.f.3 del Decreto 5/2025: veda de poda de Quercus y Fraxinus del 1 de mayo al 31 de agosto. Cortes de hasta 20 cm con carácter general y sellado de heridas de más de 15 cm. Debe pasar un mínimo de cinco años entre podas."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Normativa_Montes_CyL.doc"; document.body.appendChild(a); a.click(); a.remove();
}
render();
</script>
